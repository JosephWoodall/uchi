name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uchi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch premade-brain weights via Git LFS
        # Only uchi/data/*.pt goes into the wheel (package-data) —
        # uchi/flux/checkpoints/flux_best.pt is intentionally NOT packaged
        # (ships via the git repo/LFS instead, keeping pip installs lighter),
        # so it's not needed here either.
        run: git lfs pull --include="uchi/data/*.pt"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install build tools
        run: python -m pip install build

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
